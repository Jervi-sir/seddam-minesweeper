<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Win95 Minesweeper</title>

  <!-- Windows 95 "window face" background -->
  <rect x="0" y="0" width="64" height="64" fill="#c0c0c0" />

  <!-- Raised bevel frame -->
  <rect x="0" y="0" width="64" height="3" fill="#ffffff" />
  <rect x="0" y="0" width="3" height="64" fill="#ffffff" />
  <rect x="61" y="0" width="3" height="64" fill="#404040" />
  <rect x="0" y="61" width="64" height="3" fill="#404040" />

  <!-- Inner bevel -->
  <rect x="3" y="3" width="58" height="2" fill="#e6e6e6" />
  <rect x="3" y="3" width="2" height="58" fill="#e6e6e6" />
  <rect x="59" y="3" width="2" height="58" fill="#808080" />
  <rect x="3" y="59" width="58" height="2" fill="#808080" />

  <!-- Playfield tile -->
  <rect x="8" y="8" width="48" height="48" fill="#d6d6d6" />
  <rect x="8" y="8" width="48" height="2" fill="#404040" />
  <rect x="8" y="8" width="2" height="48" fill="#404040" />
  <rect x="54" y="8" width="2" height="48" fill="#ffffff" />
  <rect x="8" y="54" width="48" height="2" fill="#ffffff" />

  <!-- Flag (bold shapes for tiny sizes) -->
  <rect x="18" y="18" width="3" height="24" fill="#101010" />
  <polygon points="21,18 33,22 21,26" fill="#b00000" />
  <rect x="16" y="42" width="10" height="3" fill="#101010" />

  <!-- Mine -->
  <rect x="41" y="18" width="2" height="28" fill="#101010" />
  <rect x="28" y="31" width="28" height="2" fill="#101010" />
  <rect x="32" y="22" width="2" height="20" fill="#101010" transform="rotate(45 33 32)" />
  <rect x="32" y="22" width="2" height="20" fill="#101010" transform="rotate(-45 33 32)" />
  <circle cx="42" cy="32" r="10" fill="#111111" />
  <circle cx="38" cy="28" r="2" fill="#ffffff" opacity="0.9" />
</svg>
